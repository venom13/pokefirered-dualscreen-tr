plugins {
    id 'com.android.application'
}

// Public release numbering resumed at 0.1.1 after local test builds through
// 0.1.4 (10400). Keep versionCode independent and increase it on every release
// so those installations can update in place without losing saves/settings.
// Turkish edition: own package id, own numbering (first release 0.5.0).
def dualScreenVersion = '0.5.0'
def dualScreenVersionCode = 10500

android {
    buildFeatures { buildConfig true }
    // The Java package stays as it was; only the installed identity changes.
    namespace 'com.pokeemerald.experimental'
    compileSdk 36
    ndkVersion '26.3.11579264'

    defaultConfig {
        // Distinct from upstream pokeemerald-multiplatform's
        // com.pokeemerald.experimental: sharing an applicationId with a
        // differently signed APK makes each refuse to install over the other,
        // so both ports can be installed side by side.
        // Turkish edition: its own id, so it installs beside the English one.
        applicationId 'com.pokefirered.dualscreen.tr'
        minSdk 21
        targetSdk 36
        versionCode dualScreenVersionCode
        versionName dualScreenVersion

        ndk {
            abiFilters 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    buildTypes {
        debug {
            // Keep local development builds separate from the signed release
            // so installing from source never replaces the user's game/save.
            applicationIdSuffix '.debug'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    sourceSets.main.java.srcDirs += '../SDL2/android-project/app/src/main/java'
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/borderAssets'))
}

tasks.register('copyBorderAsset', Sync) {
    from(rootProject.file('..')) {
        include 'BG*.png'
        include 'Border.png'
    }
    into layout.buildDirectory.dir('generated/borderAssets')
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('copyBorderAsset')
}
